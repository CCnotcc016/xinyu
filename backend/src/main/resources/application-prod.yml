spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DB:xinyu}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 生产用专用应用账号，不再用 root 直连：SQL 注入 / 配置泄漏时能少一层权限
    username: ${MYSQL_USER:xinyu}
    # 不给默认值：缺密码时启动失败，避免又一次带着 root/root 上线
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      database: 0
      timeout: 3000
      password: ${REDIS_PASSWORD:}
  sql:
    init:
      mode: never

logging:
  level:
    com.xinyu: info

xinyu:
  jwt:
    # 生产环境必须显式注入：这里不写默认值，缺失时进程直接启动失败，
    # 避免用仓库里的公开占位值签发 JWT（任何人都能伪造管理员 token）
    secret: ${JWT_SECRET}
  ai:
    # 生产环境同样不内置 Key；留空会降级为 Mock，启动日志会明确提示
    api-key: ${AI_API_KEY:}
