spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xinyu?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000
  # 开发环境自动执行建表脚本
  sql:
    init:
      mode: always
      # upgrade-*.sql 都是幂等的增量升级脚本，老库补字段、新库自动跳过
      schema-locations: classpath:db/schema.sql,classpath:db/upgrade-v2.sql,classpath:db/upgrade-v2.2.sql,classpath:db/upgrade-v2.3.sql,classpath:db/upgrade-v2.4.sql,classpath:db/upgrade-v2.4.1.sql,classpath:db/upgrade-v3.0.sql,classpath:db/upgrade-v3.1.sql,classpath:db/upgrade-v3.2.sql,classpath:db/upgrade-v3.3.sql,classpath:db/upgrade-v3.4.sql,classpath:db/upgrade-v3.5.sql
      # seed-demo.sql 是演示数据（含 5 个普通用户 + 2 个客服），幂等且只在 dev 生效；
      # 想清空演示数据时把这一项去掉即可
      data-locations: classpath:db/data.sql,classpath:db/seed-demo.sql
      continue-on-error: false

# —— 以下是仅限本机开发/演示的开关，生产环境一律关闭 ——
xinyu:
  captcha:
    # 图形验证码接口会把答案一并返回，方便写自动化测试与本地演示
    echo-code: true
  sms:
    # 本机没有接短信服务商，验证码写日志 + 响应里回显，方便演示
    echo-code: true
