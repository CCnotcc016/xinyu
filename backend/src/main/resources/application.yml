spring:
  application:
    name: xinyu
  profiles:
    # 默认走 prod：忘记设置 profile 时要「起不来」，而不是悄悄带着开发环境的
    # echo-code（验证码回显）、默认 JWT 密钥上生产。本机开发由 scripts/run-dev.sh
    # 或 .env 显式设置 SPRING_PROFILES_ACTIVE=dev。
    active: ${SPRING_PROFILES_ACTIVE:prod}
  servlet:
    multipart:
      # 单文件上限按最宽松的树洞配图（5MB）设置，头像的 2MB 限制在 UserService 里单独校验；
      # 超出时由 GlobalExceptionHandler 统一转成友好提示。
      # 放在基础配置里让 dev / prod 共用：Spring 默认只有 1MB，
      # 生产环境不显式配置的话大于 1MB 的图片会被拒
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    hikari:
      # 默认 30s 会和前端 axios 的 30s 超时同时到点：
      # 用户只看到「网络异常」，看不到真实原因（例如 MySQL 没启动）。
      # 缩短到 10s，数据库不可用时后端能先把错误信息返回给前端
      connection-timeout: 10000

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: framework

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产默认不打印 SQL：StdOutImpl 会把每条 SQL 的参数（手机号、日记正文、
    # 密码哈希都在里面）原样刷进日志，日志被采集就等于数据泄漏。
    # 本机开发要看 SQL 时由 application-dev.yml 覆盖成 StdOutImpl。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# 自定义业务配置
xinyu:
  jwt:
    # 不提供默认值：仓库里的占位密钥是公开的，谁拿到源码谁就能伪造管理员 token。
    # 本机开发的值写在 application-dev.yml，生产环境必须注入 JWT_SECRET。
    secret: ${JWT_SECRET:}
    # 有效期（毫秒）。7 天太长：token 一旦泄漏，攻击窗口就是一整周。
    # 现在默认 24 小时，配合 token_version 可以在改密码 / 退出登录时立刻作废旧 token。
    expiration: ${JWT_EXPIRATION:86400000}
  admin:
    # 初始化管理员：仅在库里一个可用管理员都没有时创建，创建后必须首次登录改密。
    # 不设默认密码，部署时在 .env 里填 ADMIN_INIT_PASSWORD（需满足密码强度要求）。
    init-username: ${ADMIN_INIT_USERNAME:admin}
    init-password: ${ADMIN_INIT_PASSWORD:}
  ai:
    provider: deepseek
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    # 仓库内不保存任何真实 Key，只从环境变量注入（本机开发见项目根目录 .env）
    # 未配置时自动降级为离线 Mock 陪伴回复，功能可演示、不会静默使用泄漏的 Key
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-flash}
    temperature: 0.7
    max-tokens: 1024
    timeout-seconds: 90
  rate-limit:
    # 每人每天 AI 分析次数上限
    ai-daily-limit: 50
    # 每分钟发帖上限
    post-per-minute: 3
    # —— 登录防护 ——
    # 普通账号连续失败 5 次锁 15 分钟；管理员 / 客服 3 次锁 30 分钟
    login-max-attempts: 5
    login-lock-minutes: 15
    admin-login-max-attempts: 3
    admin-login-lock-minutes: 30
    # 同一个 IP 10 分钟内最多允许 20 次登录失败（撞库、密码喷洒）
    login-ip-max-attempts: 20
    login-ip-window-seconds: 600
  captcha:
    # 图形验证码有效期（秒）
    expire-seconds: 120
    # 打开后接口会直接把答案回显在响应里，仅供本地开发 / 自动化测试。
    # application-dev.yml 里已显式打开；这里默认关闭，避免误上生产。
    echo-code: false
  sms:
    # 短信验证码有效期（秒）
    expire-seconds: 300
    # 同一手机号两次发送的最小间隔（秒）
    resend-interval-seconds: 60
    # 同一手机号 24 小时内的发送上限
    daily-limit: 10
    # 打开后接口会把验证码回显在响应里（本机没有接短信服务商时用于演示）
    echo-code: false
  upload:
    # 上传文件落盘目录，生产环境建议挂成数据卷
    dir: ${XINYU_UPLOAD_DIR:./uploads}
    # 对外访问前缀，需要与 WebMvcConfig 的资源映射保持一致
    public-prefix: /uploads
    # 头像大小上限（字节），2MB
    max-avatar-bytes: 2097152
