spring:
  application:
    name: xinyu
  profiles:
    active: dev
  servlet:
    multipart:
      # 头像上传上限 2MB，超出时由 GlobalExceptionHandler 统一转成友好提示。
      # 放在基础配置里让 dev / prod 共用：Spring 默认只有 1MB，
      # 生产环境不显式配置的话大于 1MB 的头像会被拒
      max-file-size: 2MB
      max-request-size: 4MB

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: framework

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# 自定义业务配置
xinyu:
  jwt:
    # 开发环境用下面的占位值即可；生产环境见 application-prod.yml，缺 JWT_SECRET 会直接启动失败
    secret: ${JWT_SECRET:dev-only-placeholder-secret-do-not-use-in-prod-32chars}
    # 有效期（毫秒），默认 7 天
    expiration: ${JWT_EXPIRATION:604800000}
  ai:
    provider: deepseek
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    # 仓库内不保存任何真实 Key，只从环境变量注入（本机开发见项目根目录 .env）
    # 未配置时自动降级为离线 Mock 陪伴回复，功能可演示、不会静默使用泄漏的 Key
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-flash}
    temperature: 0.7
    max-tokens: 1024
    timeout-seconds: 90
  rate-limit:
    # 每人每天 AI 分析次数上限
    ai-daily-limit: 50
    # 每分钟发帖上限
    post-per-minute: 3
  captcha:
    # 图形验证码有效期（秒）
    expire-seconds: 120
    # 打开后接口会直接把答案回显在响应里，仅供本地开发 / 自动化测试。
    # application-dev.yml 里已显式打开；这里默认关闭，避免误上生产。
    echo-code: false
  sms:
    # 短信验证码有效期（秒）
    expire-seconds: 300
    # 同一手机号两次发送的最小间隔（秒）
    resend-interval-seconds: 60
    # 同一手机号 24 小时内的发送上限
    daily-limit: 10
    # 打开后接口会把验证码回显在响应里（本机没有接短信服务商时用于演示）
    echo-code: false
  upload:
    # 上传文件落盘目录，生产环境建议挂成数据卷
    dir: ${XINYU_UPLOAD_DIR:./uploads}
    # 对外访问前缀，需要与 WebMvcConfig 的资源映射保持一致
    public-prefix: /uploads
    # 头像大小上限（字节），2MB
    max-avatar-bytes: 2097152
