# 心语 · 宿主机部署示例 Nginx 配置（不使用前端容器时）
# 用法：将 frontend 构建产物 dist/ 放入 /usr/share/nginx/html，
#       后端单独以 java -jar 启动在 8080 端口。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 头像上传最大 2MB，Nginx 默认只允许 1MB，不放宽会返回 413
    client_max_body_size 5m;

    # 基础安全响应头；上线请参考 nginx/nginx-tls.conf 加 TLS + HSTS
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    # CSP：脚本与接口只认同源；头像和天气用到的第三方域名单独放行，其余一律 'none'
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://img.yzcdn.cn https://fastly.jsdelivr.net; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://api.bigdatacloud.net; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 用户上传的头像（后端 /uploads/** 静态映射）；文件名带随机串，内容不会变，可长缓存
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 7d;
    }
}
