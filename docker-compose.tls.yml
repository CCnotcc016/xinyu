# HTTPS 覆盖文件：在基础 compose 之上启用 443 + 80 跳转
#   export TLS_DIR=/etc/letsencrypt/live/xinyu.example.com
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# 证书目录需包含 fullchain.pem 与 privkey.pem。
services:
  frontend:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:-./certs}:/etc/nginx/certs:ro
