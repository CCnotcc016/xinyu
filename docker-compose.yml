services:
  mysql:
    image: mysql:8.0
    container_name: xinyu-mysql
    restart: unless-stopped
    environment:
      # 两个密码都必须显式提供：compose 里写默认值，等于把「root/root」这种
      # 公开口令跟着仓库一起发出去（P0-2）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-xinyu}
      # 应用专用账号：后端只用它连库，日常不给 root 权限
      MYSQL_USER: ${MYSQL_USER:-xinyu}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?请在 .env 中设置 MYSQL_APP_PASSWORD}
      TZ: Asia/Shanghai
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    # 不映射到宿主机：数据库只在 compose 内网可达，公网/局域网都碰不到
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # 刻意不挂 data.sql：里面曾经带一个公开口令的管理员账号。
      # 管理员由后端启动时用 ADMIN_INIT_* 引导创建（见 README）。
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xinyu-redis
    restart: unless-stopped
    # 一定要设密码：Redis 没密码 + 端口暴露时，等于把会话与限流数据送人
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: xinyu-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_DB: ${MYSQL_DB:-xinyu}
      MYSQL_USER: ${MYSQL_USER:-xinyu}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?请在 .env 中设置 MYSQL_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      JWT_SECRET: ${JWT_SECRET:?必须在 .env 中设置 JWT_SECRET，可用 openssl rand -hex 32 生成}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # 首次启动时若库里没有可用管理员，用它引导创建（创建后必须立即改密）
      ADMIN_INIT_USERNAME: ${ADMIN_INIT_USERNAME:-}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-}
      # 头像上传目录，挂到数据卷，重建容器不丢图
      XINYU_UPLOAD_DIR: /app/uploads
    volumes:
      - xinyu-uploads:/app/uploads
    # 只在内网暴露，公网入口统一走 frontend(Nginx)
    expose:
      - "8080"

  frontend:
    build: ./frontend
    container_name: xinyu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  mysql-data:
  redis-data:
  xinyu-uploads:
