server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 头像上传最大 2MB，Nginx 默认只允许 1MB，不放宽会返回 413
    client_max_body_size 5m;

    # 基础安全响应头（P1-8）。启用 HTTPS 后请改用 nginx/nginx-tls.conf，
    # 那边会额外下发 HSTS。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    # CSP：脚本与接口只认同源；头像和天气用到的第三方域名单独放行，其余一律 'none'
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://img.yzcdn.cn https://fastly.jsdelivr.net; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://api.bigdatacloud.net; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # 前端静态资源（Vue Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口反向代理
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式回复所需配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 用户上传的头像（后端 /uploads/** 静态映射）；文件名带随机串，内容不会变，可长缓存
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # expires 会同时写 Expires 与 Cache-Control；这里不要再写 add_header，
        # 一旦本层出现 add_header，server 层的安全响应头就不会继承下来
        expires 7d;
    }
}
